name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Build hev-socks5-tunnel from C++ source
        run: |
          mkdir -p hev-build
          cd hev-build
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel jni
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          $ANDROID_NDK_HOME/ndk-build APP_ABI=arm64-v8a
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp libs/arm64-v8a/libhev-socks5-tunnel.so ../app/src/main/jniLibs/arm64-v8a/
          cd ..

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notes-App-Release
          path: app/build/outputs/apk/debug/*.apk
