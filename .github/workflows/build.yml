name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 🚀 СКАЧИВАЕМ C++ МОДУЛЬ СЕТЕВОГО КАБЕЛЯ (500 КБ)
      - name: Download C++ hev-socks5-tunnel engine
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -sL https://github.com/heiher/hev-socks5-tunnel/releases/download/v2.7.2/hev-socks5-tunnel-android-arm64-v8a.so -o app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notes-App-Release
          path: app/build/outputs/apk/debug/*.apk
